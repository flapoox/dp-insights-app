<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DP Insights</title>
<meta name="theme-color" content="#6b2d8f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DP Insights">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f6f5f2; --surface:#fdfdfc; --surface-2:#f0eee9; --ink:#15151a; --ink-2:#55545c; --muted:#8a8891;
  --line:#e3e1db; --axis:#c6c3ba; --accent:#6b2d8f; --accent-soft:#efe6f5; --accent-ink:#ffffff;
  --fb:#2a78d6; --ig:#eb6834; --ads:#1baf7a; --good:#0a7a0a; --bad:#c23434; --warn:#b07400;
  --seq-0:#eef4fc; --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#5598e7; --seq-4:#256abf; --seq-5:#104281;
  --shadow:0 1px 2px rgba(20,20,30,.05),0 4px 16px rgba(20,20,30,.04);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#111114; --surface:#1a1a1e; --surface-2:#232328; --ink:#f4f3f6; --ink-2:#c2c0c9; --muted:#8e8c96;
  --line:#2c2c32; --axis:#3d3d44; --accent:#b98ad8; --accent-soft:#2d2236; --accent-ink:#15151a;
  --fb:#3987e5; --ig:#d95926; --ads:#199e70; --good:#3cc23c; --bad:#e66767; --warn:#e0a31a;
  --seq-0:#1d2230; --seq-1:#1a3456; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#86b6ef;
  --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111114; --surface:#1a1a1e; --surface-2:#232328; --ink:#f4f3f6; --ink-2:#c2c0c9; --muted:#8e8c96;
  --line:#2c2c32; --axis:#3d3d44; --accent:#b98ad8; --accent-soft:#2d2236; --accent-ink:#15151a;
  --fb:#3987e5; --ig:#d95926; --ads:#199e70; --good:#3cc23c; --bad:#e66767; --warn:#e0a31a;
  --seq-0:#1d2230; --seq-1:#1a3456; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#86b6ef;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-block:22px 16px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 17px var(--display)}
.brand h1{font-size:22px;line-height:1.1}
.brand p{margin:0;color:var(--ink-2);font-size:13px}
.conns{display:flex;flex-wrap:wrap;gap:8px}
.conn{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%}
.sample-note{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink);margin-bottom:16px}
.sample-note b{font-weight:600}

/* controls */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.range-label{font-size:12.5px;color:var(--muted);font-family:var(--mono)}

/* layout */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpis.k4{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.panel h2{font-size:16px;margin-bottom:2px}
.panel .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.section-title{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 10px;display:flex;flex-direction:column;gap:2px}
.kpi .lbl{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .val{font:700 26px/1.15 var(--display);letter-spacing:-.01em}
.kpi .delta{font-size:12.5px;font-weight:500}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.kpi svg{margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:11px var(--mono);fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.45;white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.18);transform:translate(-50%,calc(-100% - 10px));z-index:3}
.tip b{font-weight:600}
.tip .row{display:flex;align-items:center;gap:6px}

/* tables */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;user-select:none}
th[aria-sort] ::after{content:""}
th[aria-sort="descending"]::after{content:" ↓"} th[aria-sort="ascending"]::after{content:" ↑"}
td{font-variant-numeric:tabular-nums}
tr:hover td{background:var(--surface-2)}
.post-title{white-space:normal;min-width:240px;max-width:360px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid var(--line);color:var(--ink-2)}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-good{color:var(--good)} .s-warn{color:var(--warn)} .s-bad{color:var(--bad)}

/* audience */
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:92px 1fr 56px;gap:10px;align-items:center;font-size:13px}
.hb .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;display:flex;gap:2px}
.hb .fill{height:100%;border-radius:0 5px 5px 0}
.hb .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.heat{display:grid;grid-template-columns:36px repeat(24,1fr);gap:2px;font:10.5px var(--mono);color:var(--muted);min-width:520px}
.heat .c{height:20px;border-radius:3px}
.heat .h{text-align:center}
.scale{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:10px}
.scale i{width:18px;height:10px;border-radius:2px;display:inline-block}

/* insights */
.insights{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.insights li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13.5px;color:var(--ink)}
.insights .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700}
.ic.g{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.ic.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.ic.i{background:var(--accent-soft);color:var(--accent)}

/* setup */
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:12px}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font:600 13px var(--display)}
.steps h3{font-size:14.5px;margin:3px 0 2px}
.steps p{margin:0;color:var(--ink-2);font-size:13px;max-width:70ch}
code{font:12px var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:4px;word-break:break-word}
.map td:first-child{white-space:normal}
.map td{text-align:left}
.footer{margin-top:30px;color:var(--muted);font-size:12px}
@media (max-width:560px){.kpi .val{font-size:22px}.hb{grid-template-columns:78px 1fr 48px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.pt{display:flex;align-items:center;gap:10px}
.th{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--surface-2);max-width:100%}
.th-sm{width:44px;height:44px;flex:none;border-radius:6px;aspect-ratio:auto}
.th-ph{display:grid;place-items:center;color:var(--muted);font:600 14px var(--display)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:16px}
.pcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.pc-img{position:relative}
.pc-badge{position:absolute;top:8px;left:8px;color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.pc-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.pc-text{margin:0;font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-stats{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.pc-stats b{color:var(--ink);font-weight:600}
.pc-date{margin:0;font-size:11.5px;color:var(--muted)}

/* ---- Meta Ads insights + actions ---- */
.ins3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.ins h2{margin-bottom:10px}
.ins-good{border-top:3px solid var(--good)} .ins-bad{border-top:3px solid var(--bad)} .ins-next{border-top:3px solid var(--accent)}
.ins-item{padding:10px 0;border-top:1px solid var(--line)} .ins-item:first-of-type{border-top:0;padding-top:0}
.ins-item b{font-size:14px} .ins-item p{margin:4px 0 0;font-size:13px;line-height:1.45;color:var(--ink-2)}
.ins-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.abtn{font:600 12.5px var(--body);border-radius:8px;padding:7px 12px;cursor:pointer;border:1px solid transparent;text-decoration:none;display:inline-flex;align-items:center;gap:4px;line-height:1.2}
.abtn.sm{padding:4px 9px;font-size:12px}
.a-good{background:var(--accent);color:var(--accent-ink)} .a-bad{background:var(--bad);color:#fff}
.a-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)} .a-ghost:hover{border-color:var(--axis)}
.abtn:disabled{opacity:.6;cursor:default}
.bud{display:flex;align-items:center;gap:6px;white-space:nowrap}
.note{font-size:13px;color:var(--ink-2);background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:12px 0 0}
.adcards .pc-img{aspect-ratio:1/1;overflow:hidden;background:var(--surface-2)}
.adcard .ad-name{font-size:13.5px}
.ad-why{margin:0;font-size:12px;color:var(--ink-2);font-style:italic}
.tag{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff}
.t-win{background:var(--good)} .t-bad{background:var(--bad)} .t-warn{background:var(--warn)} .t-watch{background:#6b6a73} .t-ok{background:var(--fb)}
.pc-link{color:inherit;text-decoration:none;display:flex;flex-direction:column}
.pc-foot{padding:0 12px 12px;margin-top:auto}
.alog{list-style:none;margin:0;padding:0;font-size:13px} .alog li{padding:8px 0;border-top:1px solid var(--line)} .alog li:first-child{border-top:0}
dialog#actDlg{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(92vw,440px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog#actDlg::backdrop{background:rgba(10,10,20,.45)}
.dlg{padding:20px 20px 16px;display:flex;flex-direction:column;gap:8px}
.dlg h2{font:700 19px var(--display);margin:0 0 4px} .dlg p{margin:0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.fld input,.fld select{font:500 15px var(--body);padding:9px 10px;border:1px solid var(--axis);border-radius:9px;background:var(--bg);color:var(--ink)}
.fld[hidden]{display:none}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.dlg .err{color:var(--bad);font-size:13px} .dlg .ok{color:var(--good);font-size:13.5px;font-weight:600}
.boost-img{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:6px}
@media (max-width:640px){
  .kpis.k4{grid-template-columns:1fr 1fr;gap:10px}
  .kpis.k4 .kpi{padding:12px}
  .kpis.k4 .val{font-size:21px}
  .kpis.k4 .delta{font-size:11.5px}
  .ins-acts .abtn{padding:8px 12px}
}

.mark.logo{background:#fff;padding:3px;object-fit:contain;box-shadow:inset 0 0 0 1px var(--line)}
.appbar{display:flex;gap:8px;align-items:center}
.iconbtn{font:500 12.5px var(--body);color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.iconbtn:hover{color:var(--ink)}
.iconbtn{white-space:nowrap}
body{padding-top:env(safe-area-inset-top)}
@media (max-width:640px){
  .conns{display:none}
  .top{flex-wrap:nowrap;align-items:center;gap:10px}
  .brand h1{font-size:19px;line-height:1.15}
  .brand p{display:none}
  .brand h1{font-size:18px}
  .top{padding-block:14px 10px}
  .appbar{margin-left:auto}
  .iconbtn{padding:6px 10px}
}
#gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:16px;z-index:50}
#gate[hidden]{display:none}
.gate-card{width:min(100%,360px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:var(--shadow);text-align:center}
.gate-card img{width:72px;height:72px;border-radius:16px;background:#fff}
.gate-card h2{font:700 22px var(--display);margin:14px 0 4px}
.gate-card p{margin:0 0 18px;color:var(--ink-2);font-size:14px}
.gate-card input{width:100%;box-sizing:border-box;font:500 22px var(--mono);letter-spacing:.3em;text-align:center;padding:12px;border:1px solid var(--axis);border-radius:12px;background:var(--bg);color:var(--ink)}
.gate-card input:focus{outline:2px solid var(--accent);outline-offset:1px}
.gate-card button{margin-top:12px;width:100%;font:600 15px var(--body);padding:12px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.gate-card button:disabled{opacity:.6}
.gate-err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style></head><body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img class="mark logo" src="icon-192.png" alt="">
      <div>
        <h1>Digital Poonam Insights</h1>
        <p>Facebook Page · Instagram @digitalcoachpoonam · Meta Ads</p>
      </div>
    </div>
    <div class="appbar"><div class="conns" id="conns"></div><button class="iconbtn" id="refreshBtn" type="button" aria-label="Refresh" title="Refresh">↻</button><button class="iconbtn" id="lockBtn" type="button">Lock</button></div>
  </header>

  <div class="sample-note" role="note" id="syncNote"></div>

  <div class="bar">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="overview" aria-selected="true" id="t-overview">Overview</button>
      <button class="tab" role="tab" data-tab="instagram" aria-selected="false" id="t-instagram">Instagram</button>
      <button class="tab" role="tab" data-tab="facebook" aria-selected="false" id="t-facebook">Facebook</button>
      <button class="tab" role="tab" data-tab="ads" aria-selected="false" id="t-ads">Meta Ads</button>
      <button class="tab" role="tab" data-tab="posts" aria-selected="false" id="t-posts">Posts</button>
      <button class="tab" role="tab" data-tab="audience" aria-selected="false" id="t-audience">Audience</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="range-label" id="rangeLabel"></span>
      <div class="seg" id="range" aria-label="Date range">
        <button data-d="7" aria-pressed="false" id="r7">7 days</button>
        <button data-d="30" aria-pressed="true" id="r30">30 days</button>
        <button data-d="90" aria-pressed="false" id="r90">90 days</button>
      </div>
    </div>
  </div>

  <main id="view"></main>
  <p class="footer">Periods compare against the previous period of equal length. Ad spend in ₹ as reported by Meta. "—" means Meta has not returned that metric for this account.</p>
</div>

<dialog id="actDlg" aria-label="Confirm change"></dialog>
<div id="gate" hidden>
  <form class="gate-card" id="gateForm" autocomplete="off">
    <img src="icon-192.png" alt="Digital Poonam">
    <h2>DP Insights</h2>
    <p id="gateMsg">Enter your PIN to open the dashboard.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" aria-label="PIN" required minlength="6">
    <button id="gateBtn" type="submit">Open</button>
    <div class="gate-err" id="gateErr" role="alert"></div>
  </form>
</div>
<script src="config.js"></script>
<script src="boot.js"></script>
</body></html>
