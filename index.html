<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DP Insights</title>
<meta name="app-version" content="3.3">
<meta name="theme-color" content="#FAF8F5">
<script>try{var t=localStorage.getItem('dp-theme');if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.querySelector('meta[name="theme-color"]').setAttribute('content',t==='dark'?'#0B0B0C':'#FAF8F5')}catch(e){}</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DP Insights">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ============ DP Insights 3.0 · black + orange (from the dP logo) ============ */
:root{
  color-scheme:light;
  --bg:#FAF8F5; --surface:#FFFFFF; --surface-2:#F2EFEA; --ink:#141414; --ink-2:#3D3A36; --muted:#68635C;
  --line:#E8E4DD; --axis:#D6D0C7; --accent:#F8A01B; --accent-soft:#FDF0DA; --accent-ink:#141414; --accent-text:#8F5300;
  --hero:#141414; --hero-ink:#FFFFFF; --hero-muted:#B8B2A9; --hero-line:#2E2C29; --hero-border:#141414; --hero-bar:#66625C; --hero-best:#B07A2A;
  --chart-good:#6EE7A0; --chart-bad:#FF9C8F;
  --good:#17734A; --good-soft:#E2F2E9; --bad:#B8352A; --bad-soft:#FBE8E5; --warn:#835300; --warn-soft:#FFF1D6;
  --fb:#1565D8; --ig:#C92A72; --ads:#0B7F62; --yt:#C4221A; --yt2:#0F7A7A; --web:#5B4BC4;
  --seq-0:#F6EFE4; --seq-1:#F3DDB8; --seq-2:#F2C27A; --seq-3:#F8A01B; --seq-4:#C77A08; --seq-5:#7A4A00;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 10px 30px rgba(20,20,20,.06);
  --nav:rgba(255,255,255,.92); --glow:rgba(248,160,27,.40);
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Plus Jakarta Sans",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-card:22px; --r-btn:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0B0B0C; --surface:#161618; --surface-2:#222225; --ink:#F5F3EF; --ink-2:#D2CDC5; --muted:#A39D94;
  --line:#2A2A2E; --axis:#3D3D42; --accent-soft:#2B2214; --accent-text:#FFB547;
  --hero:#000000; --hero-muted:#ADA79E; --hero-line:#2A2A2E; --hero-border:#2E2E33;
  --good:#5BD08A; --good-soft:#11291B; --bad:#FF8A7A; --bad-soft:#2E1714; --warn:#F0B44C; --warn-soft:#2A2213;
  --seq-0:#1E1A14; --seq-1:#3A2C14; --seq-2:#6A4A14; --seq-3:#A86C10; --seq-4:#F8A01B; --seq-5:#FFD08A;
  --shadow:none; --nav:rgba(22,22,24,.94); --glow:rgba(248,160,27,.45);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0B0C; --surface:#161618; --surface-2:#222225; --ink:#F5F3EF; --ink-2:#D2CDC5; --muted:#A39D94;
  --line:#2A2A2E; --axis:#3D3D42; --accent-soft:#2B2214; --accent-text:#FFB547;
  --hero:#000000; --hero-muted:#ADA79E; --hero-line:#2A2A2E; --hero-border:#2E2E33;
  --good:#5BD08A; --good-soft:#11291B; --bad:#FF8A7A; --bad-soft:#2E1714; --warn:#F0B44C; --warn-soft:#2A2213;
  --seq-0:#1E1A14; --seq-1:#3A2C14; --seq-2:#6A4A14; --seq-3:#A86C10; --seq-4:#F8A01B; --seq-5:#FFD08A;
  --shadow:none; --nav:rgba(22,22,24,.94); --glow:rgba(248,160,27,.45);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);font-feature-settings:"tnum" 1;padding-inline:16px;padding-block:0 48px;transition:background .3s,color .3s}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.015em;font-weight:800}
a{color:var(--accent-text)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sub{color:var(--muted)}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:42px;height:42px;border-radius:13px;background:#FFFFFF;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.mark img,.mark svg{width:34px;height:34px;object-fit:contain}
.mark.logo{padding:4px;object-fit:contain}
.brand h1{font-size:19px;line-height:1.15;font-weight:800}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.topacts{display:flex;align-items:center;gap:8px;flex:none}
.themebtn,.iconbtn{height:44px;min-width:44px;padding:0 12px;border-radius:var(--r-btn);border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 13px var(--body);white-space:nowrap}
.themebtn svg{flex:none}
.conns{display:none}
.conn{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%}
.sample-note{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin:0 0 6px}
.sample-note b{font-weight:700;color:var(--ink-2)}
.live-dot{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.18);flex:none}

/* ---------- controls ---------- */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 14px;border-radius:12px;color:var(--ink-2);font-weight:600;white-space:nowrap;min-height:40px}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.seg{display:inline-flex;border-radius:15px;background:var(--surface-2);padding:4px;gap:2px}
.seg button{border:0;background:none;padding:0 14px;min-height:36px;border-radius:11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.10)}
.range-label{font-size:12.5px;color:var(--muted)}

/* ---------- layout primitives ---------- */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpis.k4{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 20px;min-width:0;box-shadow:var(--shadow)}
.panel h2{font-size:17px;margin-bottom:2px}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.section-title{font:800 18px var(--display);letter-spacing:-.01em;color:var(--ink);margin:28px 0 12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);min-width:0}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .lbl .sw{display:none}
.kpi .val{font:800 26px/1.15 var(--display);letter-spacing:-.02em}
.kpi .delta{font-size:12.5px;font-weight:700}
.kpi svg{margin-top:6px}
.delta.up,.delta.down{align-self:flex-start;padding:3px 9px;border-radius:999px}
.delta.up{background:var(--good-soft)} .delta.down{background:var(--bad-soft)}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:600 11px var(--body);fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.45;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.2);transform:translate(-50%,calc(-100% - 10px));z-index:3}
.tip b{font-weight:800}
.tip .row{display:flex;align-items:center;gap:6px}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:11px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:700;color:var(--muted);font-size:12px;cursor:pointer;user-select:none}
th[aria-sort="descending"]::after{content:" ↓"} th[aria-sort="ascending"]::after{content:" ↑"}
td{font-variant-numeric:tabular-nums}
tr:hover td{background:var(--surface-2)}
.post-title{white-space:normal;min-width:240px;max-width:360px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-good{color:var(--good)} .s-warn{color:var(--warn)} .s-bad{color:var(--bad)}

/* ---------- horizontal bars, heatmap ---------- */
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:96px 1fr 56px;gap:10px;align-items:center;font-size:13.5px}
.hb .track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden;display:flex;gap:2px}
.hb .fill{height:100%;border-radius:0 6px 6px 0}
.hb .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:700}
.heat{display:grid;grid-template-columns:36px repeat(24,1fr);gap:2px;font:600 10.5px var(--body);color:var(--muted);min-width:520px}
.heat .c{height:20px;border-radius:4px}
.heat .h{text-align:center}
.scale{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:10px}
.scale i{width:18px;height:10px;border-radius:2px;display:inline-block}

/* ---------- insights ---------- */
.insights{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.insights li{display:grid;grid-template-columns:32px 1fr;gap:12px;font-size:14px;line-height:1.5;color:var(--ink-2);align-items:start}
.insights li b{color:var(--ink)}
.insights .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:800}
.ic.g{background:var(--good-soft);color:var(--good)}
.ic.w{background:var(--warn-soft);color:var(--warn)}
.ic.i{background:var(--accent-soft);color:var(--accent-text)}

/* ---------- setup steps ---------- */
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:12px}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 13px var(--display)}
ol.steps{margin:8px 0 0;padding-left:0;line-height:1.6}
.steps h3{font-size:14.5px;margin:3px 0 2px}
.steps p{margin:0;color:var(--ink-2);font-size:13px;max-width:70ch}
code{font:12px var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:4px;word-break:break-word}
.footer{margin-top:30px;color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- post cards ---------- */
.pt{display:flex;align-items:center;gap:10px}
.th{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--surface-2);max-width:100%}
.th-sm{width:44px;height:44px;flex:none;border-radius:10px;aspect-ratio:auto}
.th-ph{display:grid;place-items:center;color:var(--muted);font:800 15px var(--display)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:14px}
.pcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s;box-shadow:var(--shadow)}
.pcard:hover{transform:translateY(-2px)}
.pc-img{position:relative}
.pc-badge{position:absolute;top:10px;left:10px;color:#fff;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px}
.pc-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.pc-text{margin:0;font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-stats{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.pc-stats b{color:var(--ink);font-weight:800}
.pc-date{margin:0;font-size:12px;color:var(--muted)}
.pc-link{color:inherit;text-decoration:none;display:flex;flex-direction:column}
.pc-foot{padding:0 14px 14px;margin-top:auto}

/* ---------- buttons ---------- */
.abtn{font:700 13px var(--body);border-radius:12px;padding:10px 14px;min-height:40px;cursor:pointer;border:1px solid transparent;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2}
.abtn.sm{padding:6px 11px;min-height:34px;font-size:12.5px}
.a-good{background:var(--accent);color:var(--accent-ink)}
.a-bad{background:var(--bad);color:#FFFFFF}
:root[data-theme="dark"] .a-bad{color:#141414}
.a-ghost{background:var(--surface);color:var(--ink);border-color:var(--axis)} .a-ghost:hover{border-color:var(--ink-2)}
.abtn:disabled{opacity:.6;cursor:default}
.bud{display:flex;align-items:center;gap:6px;white-space:nowrap}
.note{font-size:13.5px;color:var(--ink-2);background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin:12px 0 0}

/* ---------- Meta Ads ---------- */
.ins3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.ins h2{margin-bottom:10px}
.ins-good{box-shadow:inset 0 4px 0 var(--good),var(--shadow)} .ins-bad{box-shadow:inset 0 4px 0 var(--bad),var(--shadow)} .ins-next{box-shadow:inset 0 4px 0 var(--accent),var(--shadow)}
.ins-item{padding:12px 0;border-top:1px solid var(--line)} .ins-item:first-of-type{border-top:0;padding-top:0}
.ins-item b{font-size:14.5px} .ins-item p{margin:4px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.ins-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.adcards .pc-img{aspect-ratio:1/1;overflow:hidden;background:var(--surface-2)}
.adcard .ad-name{font-size:14px}
.ad-why{margin:0;font-size:12.5px;color:var(--ink-2)}
.tag{position:absolute;top:10px;right:10px;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;color:#fff}
.t-win{background:#17734A} .t-bad{background:#B8352A} .t-warn{background:#835300} .t-watch{background:#57534E} .t-ok{background:#1565D8}
.alog{list-style:none;margin:0;padding:0;font-size:13.5px} .alog li{padding:10px 0;border-top:1px solid var(--line)} .alog li:first-child{border-top:0}

/* ---------- dialog ---------- */
dialog#actDlg{border:0;border-radius:24px;padding:0;background:var(--surface);color:var(--ink);width:min(92vw,440px);box-shadow:0 24px 70px rgba(0,0,0,.3)}
dialog#actDlg::backdrop{background:rgba(10,10,10,.55)}
.dlg{padding:22px 22px 18px;display:flex;flex-direction:column;gap:10px}
.dlg h2{font:800 20px var(--display);margin:0 0 4px} .dlg p{margin:0}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);font-weight:700}
.fld input,.fld select{font:600 15px var(--body);padding:11px 12px;border:1px solid var(--axis);border-radius:12px;background:var(--bg);color:var(--ink);min-height:46px}
.fld[hidden]{display:none}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.dlg .err{color:var(--bad);font-size:13.5px} .dlg .ok{color:var(--good);font-size:14px;font-weight:700}
.boost-img{width:100%;max-height:180px;object-fit:cover;border-radius:14px;margin-top:6px}

/* ---------- YouTube ---------- */
.ytbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:12px}
.ytbar .seg{flex-wrap:wrap}
.ytchs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.ytch{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 14px 8px 8px;color:inherit;text-decoration:none;min-width:0}
.ytch img{width:40px;height:40px;border-radius:50%;flex:none}
.ytch>span{display:flex;flex-direction:column;min-width:0}
.ytch .sub{margin:0}
.ytcards .pc-img{aspect-ratio:16/9;overflow:hidden;background:var(--surface-2)}
.ytcards .pc-img .th{width:100%;height:100%;object-fit:cover}

/* ---------- Scripts ---------- */
.splan{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.ybar{display:flex;flex-wrap:wrap;gap:10px}
.ybar .seg{flex-wrap:wrap}
.scards{display:grid;gap:14px;margin-top:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.sc-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sc-no{font-weight:800;color:var(--muted)}
.sc-type{color:var(--ink);background:var(--surface-2);font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
.sc-st{margin-left:auto;border:1px solid var(--axis);border-radius:10px;padding:6px 8px;min-height:38px;background:var(--surface);color:var(--ink);font:600 13px var(--body)}
.scard h3{margin:4px 0 0;font-size:17px;line-height:1.35}
.sc-owner{margin:0;color:var(--muted);font-size:13px}
.scard blockquote{margin:4px 0;padding:12px 14px;background:var(--surface-2);border-radius:14px;font-weight:600;color:var(--ink-2)}
.scard details summary{cursor:pointer;color:var(--accent-text);font-weight:700;font-size:14px;padding:6px 0}
.sc-body p{margin:6px 0}
.scard dl{margin:10px 0 0;font-size:13.5px}.scard dt{font-weight:800;margin-top:8px}.scard dd{margin:2px 0 0;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:100;max-width:90vw;font-weight:600}

/* ---------- Teleprompter (always dark) ---------- */
.tp{position:fixed;inset:0;z-index:90;background:#000;color:#fff;overflow:hidden}
.tp-v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.tp-msg{position:absolute;left:16px;right:16px;top:45%;text-align:center;color:#ddd;font-size:15px}
.tp-strip{position:absolute;left:0;right:0;top:0;overflow:hidden;background:rgba(0,0,0,.5);padding:14px 18px 0;cursor:pointer;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.tp-text{font-weight:800;line-height:1.35;text-shadow:0 1px 3px rgba(0,0,0,.8);will-change:transform}
.tp-text p{margin:0 0 .5em}.tp-end{opacity:.6;text-align:center}
.tp-count{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:96px;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.tp-bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px 10px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.75))}
.tp-bar button{border:0;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font:inherit;font-weight:800;padding:10px 14px;min-width:44px;min-height:44px;backdrop-filter:blur(4px)}
.tp-bar .tp-main{background:#F8A01B;color:#141414}
.tp-bar .tp-rec.on{background:#E53935}
.tp-bar button:disabled{opacity:.4}
.tp-save{position:absolute;right:14px;bottom:84px;background:#fff;color:#111;font-weight:800;padding:10px 14px;border-radius:999px;text-decoration:none}

/* ---------- Competition ---------- */
.compcards{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.compcards .pc-img{aspect-ratio:4/5;overflow:hidden;background:var(--surface-2)}
.compcards .pc-img.yt{aspect-ratio:16/9}
.compcards .pc-img .th{width:100%;height:100%;object-fit:cover}
.pc-kind{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.7);color:#fff;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.pc-who{margin:0;font-size:13.5px;font-weight:800}.pc-who span{font-weight:500;color:var(--muted)}
.compcards .pc-foot .abtn{width:100%}
tr.me td{background:var(--accent-soft)}
td.rs a{display:inline-block;margin-right:10px;white-space:nowrap;font-weight:700}
.clist{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink-2)}
.clist b{color:var(--ink)}

/* ---------- Home ---------- */
.hhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 4px;flex-wrap:wrap}
.hello{font:800 30px/1.1 var(--display);letter-spacing:-.025em}
.hdate{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 4px}
.ai-link{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--accent-text);font-weight:800;font-size:14px;padding:10px 4px;min-height:44px}
.cap{font:800 18px var(--display);letter-spacing:-.01em;color:var(--ink);margin:28px 0 12px}
.cap.row{display:flex;justify-content:space-between;align-items:center}
.linkbtn{border:0;background:none;color:var(--accent-text);font:800 14px var(--body);padding:10px 2px;min-height:44px}
.pbadge{width:28px;height:28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font:800 10.5px var(--body);color:#fff;flex:none}
.pbadge.ig{background:var(--ig)}.pbadge.fb{background:var(--fb)}.pbadge.ads{background:var(--ads)}.pbadge.yt{background:var(--yt)}.pbadge.web{background:var(--web)}
/* big summary card */
.hsum{margin-top:16px;background:var(--hero);color:var(--hero-ink);border:1px solid var(--hero-border);border-radius:28px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:14px}
.hs-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--hero-muted)}
.hs-live{padding:4px 10px;border-radius:999px;background:var(--hero-line);color:#fff;font-size:12px;font-weight:800}
.hs-main{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hs-big{font:800 46px/1 var(--display);letter-spacing:-.03em}
.hs-d{display:flex;flex-direction:column;gap:2px;padding-bottom:4px;font-size:12px;color:var(--hero-muted)}
.hs-d .up{color:var(--chart-good);font-size:14px;font-weight:800}.hs-d .down{color:var(--chart-bad);font-size:14px;font-weight:800}.hs-d .flat{color:var(--hero-muted)}
.hs-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--hero-line);padding-top:12px}
.hs-stats span{display:block;font-size:12px;color:var(--hero-muted)}
.hs-stats b{display:block;font:800 18px var(--display)}
/* tappable bars (black chart) */
.bchart{display:flex;flex-direction:column;gap:8px}
.bc-bars{height:150px;display:flex;align-items:flex-end;padding-top:24px}
.bc-bars.sm{height:96px;padding-top:20px}
.bc-b{flex:1 1 0;min-width:0;height:100%;padding:0 3px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;cursor:pointer}
.bc-b i{display:block;width:100%;max-width:36px;border-radius:8px 8px 3px 3px;background:var(--hero-bar);transition:height .45s cubic-bezier(.2,.8,.2,1),background .25s,box-shadow .25s}
.bc-b.best i{background:var(--hero-best)}
.bc-b.on i{background:var(--accent);box-shadow:0 0 18px var(--glow)}
.bc-b span{font-size:11.5px;font-weight:800;color:var(--accent);white-space:nowrap;visibility:hidden}
.bc-b.on span{visibility:visible}
.bc-dense .bc-b{padding:0 1px}.bc-dense .bc-b i{border-radius:4px 4px 2px 2px}
.bc-lab{display:flex}
.bc-lab span{flex:1 1 0;min-width:0;text-align:center;font-size:11px;font-weight:600;color:var(--hero-muted);white-space:nowrap}
.bc-lab span.on{color:#fff;font-weight:800}
.bc-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--hero-muted);border-top:1px solid var(--hero-line);padding-top:10px}
.bc-foot .g{color:var(--chart-good)}.bc-foot .r{color:var(--chart-bad)}
.bc-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.bc-chips::-webkit-scrollbar{display:none}
.bc-chips button{flex:none;height:36px;padding:0 13px;border-radius:12px;border:1px solid var(--hero-line);background:transparent;color:var(--hero-muted);font:700 13px var(--body);white-space:nowrap}
.bc-chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bc-hint{font-size:12px;font-weight:600;color:var(--hero-muted)}
.dkcard{background:var(--hero);color:var(--hero-ink);border:1px solid var(--hero-border);border-radius:24px;padding:16px 16px 12px}
/* channel tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border:1px solid var(--line);text-align:left;background:var(--surface);color:var(--ink);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0}
.tile:hover{border-color:var(--axis)}
.t-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden}
.t-v{font:800 24px/1.1 var(--display);letter-spacing:-.02em;margin-top:2px}
.t-l{font-size:12px;color:var(--muted);font-weight:600}
.t-d{font-size:12.5px;font-weight:800;align-self:flex-start}
.t-d .up,.t-d .down{padding:3px 9px;border-radius:999px;display:inline-block}
.t-d .up{background:var(--good-soft)}.t-d .down{background:var(--bad-soft)}
.mini{display:block;width:100%;height:30px}
.tile.add{background:transparent;border:1.5px dashed var(--axis);box-shadow:none;justify-content:center}
.tile.add .t-l{color:var(--ink-2)}
/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.li{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:4px;width:100%;color:var(--ink);min-height:56px}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.li-t{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:15px}
.li-s{font-size:13px;color:var(--muted)}
.stype{flex:none;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;color:var(--accent-text);background:var(--accent-soft)}
.vrow{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.vrow::-webkit-scrollbar{display:none}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;color:inherit;text-decoration:none;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.vc-img{position:relative;aspect-ratio:4/5;background:var(--surface-2);overflow:hidden;display:block}
.vc-img .th{width:100%;height:100%;object-fit:cover}
.vc-b{position:absolute;top:8px;left:8px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px}
.vc-t{padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:2px;min-width:0}
.vc-t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vc-t span{color:var(--muted)}
.hgrid2{display:grid;gap:0 14px}

/* ---------- Platform screen ---------- */
.pfilter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:4px;border-radius:16px;background:var(--surface-2);gap:2px}
.pfilter button{border:0;background:none;min-height:40px;border-radius:12px;font:700 14px var(--body);color:var(--muted)}
.pfilter button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.10)}
.psum{margin-top:14px;background:var(--hero);color:var(--hero-ink);border:1px solid var(--hero-border);border-radius:26px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.ps-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--hero-muted);flex-wrap:wrap}
.ps-main{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ps-big{font:800 40px/1 var(--display);letter-spacing:-.03em}
.ps-d{padding-bottom:5px;font-size:14px;font-weight:800}
.ps-d.up{color:var(--chart-good)}.ps-d.down{color:var(--chart-bad)}.ps-d.flat{color:var(--hero-muted)}
.ps-note{font-size:13px;color:var(--hero-muted)}
.pday{margin:24px 0 10px}
.pday h2{font-size:19px}
.pday p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.dboxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dbox{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-width:0}
.dbox .k{font-size:12.5px;font-weight:700;color:var(--muted)}
.dbox .v{font:800 24px/1.1 var(--display);letter-spacing:-.02em}
.dbox .dp{align-self:flex-start;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.dbox .dp.up{background:var(--good-soft);color:var(--good)}.dbox .dp.down{background:var(--bad-soft);color:var(--bad)}.dbox .dp.flat{background:var(--surface-2);color:var(--muted)}
.dbox .vs{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:-3px}
.dbox .tg{font-size:11.5px;font-weight:800;min-height:15px}
.dbox .tg.hi{color:var(--good)}.dbox .tg.lo{color:var(--bad)}
.dposts{margin-top:12px}
.dpost{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dpost .th-sm{width:44px;height:56px}
.dpost .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dpost .t b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dpost .t span{font-size:12px;color:var(--muted)}
.dpost .r{text-align:right}.dpost .r b{display:block;font:800 16px var(--display)}.dpost .r span{font-size:11px;color:var(--muted)}
.ptip{margin-top:12px;background:var(--accent-soft);border-radius:22px;padding:16px;display:flex;gap:12px;align-items:flex-start}
.ptip .ico{width:34px;height:34px;border-radius:11px;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--accent-text)}
.ptip b{display:block;font-size:14px;margin-bottom:2px}
.ptip span{font-size:14px;line-height:1.5;color:var(--ink-2)}
/* small hero for Ads / YouTube / Website */
.chero{margin-bottom:16px}
.hero{background:var(--hero);color:var(--hero-ink);border:1px solid var(--hero-border);border-radius:26px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:14px}
.h-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.h-sw{display:flex;align-items:center;gap:8px}
.h-sw b{font-size:13px;letter-spacing:.06em}
.h-rg{font-size:13px;font-weight:700;color:var(--hero-muted)}
.h-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.h-row+.h-row{border-top:1px solid var(--hero-line);padding-top:12px}
.h-k{font-size:12px;font-weight:700;color:var(--hero-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-v{font:800 22px/1.2 var(--display)}
.h-d{font-size:12.5px;font-weight:800}
.dk .up,.hero .up{color:var(--chart-good)}.dk .down,.hero .down{color:var(--chart-bad)}.dk .flat,.hero .flat{color:var(--hero-muted)}
.h-ch{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--hero-muted)}
/* channels */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px;margin-top:14px}
.cc{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:104px;box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.cc.dk{background:var(--hero);border-color:var(--hero-border);color:#fff}
button.cc:hover{border-color:var(--axis)}
.c-h{display:flex;align-items:center;gap:8px;font-size:15px}
.c-h b{flex:1}
.c-r{display:flex;justify-content:space-between;font-size:13.5px}
.cc.dk .c-r span{color:var(--hero-muted)}
.c-note{font-size:13px;color:var(--muted)}
.st{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.st.on{background:#22C55E}.st.pend{background:#F8A01B}.st.off{background:#8A847C}
.c-legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--ink-2);margin-top:14px}
.c-legend span{display:inline-flex;align-items:center;gap:6px}
/* Publish (coming) */
.pubhero{background:var(--hero);color:#fff;border:1px solid var(--hero-border);border-radius:28px;padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.pubhero h2{font-size:22px}
.pubhero p{margin:0;color:var(--hero-muted);font-size:14px;line-height:1.5}
.prow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:64px}
.prow:last-child{border-bottom:0}
.prow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow .t b{font-size:15px}.prow .t span{font-size:12.5px;color:var(--muted)}

/* ---------- back row + navigation ---------- */
.backrow{display:none;align-items:center;gap:8px;margin:0 0 8px}
.backbtn{border:0;background:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-left:-10px;color:var(--ink)}
.backbtn:hover{background:var(--surface-2)}
#backTitle{font:800 24px var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
#backTitle .pbadge{width:34px;height:34px;border-radius:11px;font-size:12px}
.backrow:not([hidden]){display:flex}
.bnav{display:none}
@media (max-width:900px){
  body{padding-bottom:120px}
  .bar .tabs{display:none}
  .bar{justify-content:flex-end;padding-block:2px;margin-bottom:6px;position:static}
  .backrow:not([hidden]){display:flex}
  .bnav{display:flex;position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;height:68px;border-radius:26px;background:var(--nav);border:1px solid var(--line);box-shadow:0 10px 30px rgba(10,8,5,.14);justify-content:space-around;align-items:center;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);max-width:560px;margin:0 auto}
  .bnav button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;min-width:58px;min-height:54px;justify-content:center}
  .bnav button[aria-current="page"]{color:var(--accent-text);font-weight:800}
  .bnav .pub{width:56px;min-width:56px;height:56px;min-height:56px;margin-top:-24px;border-radius:20px;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px var(--glow);font-size:0;gap:0}
  .bnav .pub[aria-current="page"]{color:var(--accent-ink)}
  .footer{display:none}
  .cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cc{padding:14px;min-height:96px;border-radius:20px}
  .brand p,.range-label{display:none}
  .top{padding-block:14px 6px}
}
@media (max-width:380px){
  body{padding-inline:12px}
  .hello{font-size:26px}.hs-big{font-size:40px}.ps-big{font-size:34px}
  .tiles{gap:10px}.tile{padding:14px}.t-v{font-size:21px}
  .dboxes{gap:8px}.dbox{padding:12px}.dbox .v{font-size:21px}
  .brand h1{font-size:17px}
  .themebtn .tl{display:none}
  .hb{grid-template-columns:78px 1fr 48px}
}
/* open foldable (≈600–900px): use the space */
@media (min-width:600px){
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .dboxes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hgrid2{grid-template-columns:1fr 1fr}
  .bc-bars{height:180px}
}
/* laptop: left sidebar */
@media (min-width:901px){
  body{padding-left:0}
  .wrap{max-width:none;margin:0;padding-left:268px;padding-right:32px}
  .top{position:fixed;left:0;top:0;bottom:0;width:244px;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:24px 16px;background:var(--surface);border-right:1px solid var(--line);z-index:20;gap:20px}
  .top .topacts{order:3;margin-top:auto;justify-content:space-between}
  .bar{position:static;padding-top:24px}
  .tabs{position:fixed;left:16px;top:96px;bottom:100px;width:212px;flex-direction:column;flex-wrap:nowrap;z-index:21;overflow-x:hidden;overflow-y:auto;gap:2px;padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--axis) transparent}
  .tabs::-webkit-scrollbar{width:6px}.tabs::-webkit-scrollbar-thumb{background:var(--axis);border-radius:6px}
  .tab{text-align:left;padding:9px 14px;min-height:42px;flex:none}
  .backrow{margin:6px 0 14px}
  #backTitle{font-size:34px}
  #backTitle .pbadge{width:40px;height:40px;border-radius:12px;font-size:13px}
  .backrow .backbtn{display:none}
  .tab[aria-selected="true"]{background:var(--surface-2);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
  .sample-note{margin-top:22px}
  .hsum .bc-bars{height:180px}
}
/* one period switch per screen */
body[data-screen="instagram"] #range,body[data-screen="facebook"] #range,body[data-screen="publish"] #range,body[data-screen="scripts"] #range,body[data-screen="competition"] #range,body[data-screen="channels"] #range,body[data-screen="audience"] #range,body[data-screen="team"] #range{display:none}
@media (max-width:599px){
  .cards{grid-template-columns:1fr 1fr;gap:10px}
  .cards .pc-img .th{aspect-ratio:4/5;object-fit:cover}
  .cards .pc-body{padding:10px}
  .cards .pc-foot{padding:0 10px 10px}
  .cards .pc-stats{gap:6px;font-size:12px}
}
.hs-live{white-space:nowrap}
@media (max-width:640px){.kpis.k4{grid-template-columns:1fr 1fr;gap:10px}.kpis.k4 .kpi{padding:14px 12px 10px}.kpis.k4 .val{font-size:21px}.splan{grid-template-columns:1fr 1fr;gap:10px}.splan .kpi .val{font-size:18px!important}}
/* ---------- Team ---------- */
.who{margin-left:auto;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-weight:700;font-size:12px;white-space:nowrap}
.tm-cap{font-size:13px;font-weight:800;color:var(--muted);margin:22px 0 8px}
.tm-row{border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;padding:12px 16px;min-height:68px;display:flex;align-items:center;gap:12px;color:var(--ink)}
